name: Validate project editor

on:
  push:
    branches:
      - agent/proyectos-editables

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-placeholder
      AIRTABLE_BASE_ID: appJwwHP1Wkoxo54q
      AIRTABLE_PROJECTS_TABLE_ID: tblf6DZBViGbvxRzS
      PROJECT_EDITOR_EMAILS: editor@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false
      - run: npm run build
