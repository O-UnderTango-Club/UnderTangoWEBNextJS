<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnderTango — Restablecer contraseña</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0b;
      --red:#e10600;
      --glass: rgba(255,255,255,0.04);
      --danger:#ff3b3b;
      --radius:18px;
      --shadow: 0 18px 45px rgba(0,0,0,0.6);
      color-scheme: dark;
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }

    body{
      margin:0;
      font-family:'Poppins', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% 20%, rgba(225,6,6,0.06), transparent),
        radial-gradient(1000px 500px at 90% 80%, rgba(225,6,6,0.04), transparent),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:white;
    }

    .card{
      max-width:420px;
      width:100%;
      background:linear-gradient(180deg, rgba(20,20,20,0.95), rgba(10,10,10,0.9));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:36px 30px;
      animation: enter 700ms cubic-bezier(.2,.9,.2,1);
    }

    @keyframes enter{
      from{ opacity:0; transform:translateY(30px) }
      to{ opacity:1; transform:none }
    }

    .logo{
      width:72px;
      height:72px;
      margin:0 auto 16px auto;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      letter-spacing:1px;
      background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
      border:1px solid rgba(255,255,255,0.05);
    }

    h1{
      text-align:center;
      margin:0 0 6px 0;
      font-size:24px;
    }

    .muted{
      text-align:center;
      font-size:13px;
      color:rgba(255,255,255,0.6);
      margin-bottom:22px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:14px;
    }

    label{
      font-size:13px;
      color:rgba(255,255,255,0.75);
    }

    input{
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.05);
      padding:13px;
      border-radius:12px;
      color:white;
      outline:none;
      font-size:15px;
    }

    input:focus{
      border-color:rgba(225,6,6,0.7);
      box-shadow:0 0 0 1px rgba(225,6,6,0.4);
    }

    .btn{
      width:100%;
      margin-top:10px;
      padding:12px;
      border-radius:12px;
      border:0;
      background:linear-gradient(120deg, rgba(225,6,6,0.95), rgba(150,0,0,0.9));
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    .msg{
      min-height:20px;
      margin-top:10px;
      font-size:13px;
      text-align:center;
    }

    .error{ color:var(--danger) }
    .success{ color:#4caf50 }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">UT</div>

    <h1>Nueva contraseña</h1>
    <div class="muted">
      Ingresá una nueva contraseña para tu cuenta
    </div>

    <form id="reset-form">
      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" required minlength="6" />
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <input id="confirm" type="password" required minlength="6" />
      </div>

      <button class="btn" type="submit">Guardar contraseña</button>

      <div id="msg" class="msg"></div>
    </form>
  </div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>

  const SUPABASE_URL = "https://gxfrdztmophpmywcaqjt.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_G8H99tYuejvs1b_oRkWajg_nkU1qtGD";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const form = document.getElementById("reset-form");
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirm");
  const msg = document.getElementById("msg");

  // 🔑 CLAVE: recuperar la sesión desde el hash del URL
  (async () => {
    const { error } = await supabaseClient.auth.getSession();
    if (error) {
      msg.textContent = "El enlace de recuperación no es válido o expiró.";
      msg.className = "msg error";
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'msg';

    if (password.value !== confirm.value) {
      msg.textContent = "Las contraseñas no coinciden.";
      msg.className = "msg error";
      return;
    }

    const btn = form.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Guardando...";

    const { error } = await supabaseClient.auth.updateUser({
      password: password.value
    });

    if (error) {
      msg.textContent = error.message;
      msg.className = "msg error";
      btn.disabled = false;
      btn.textContent = "Guardar contraseña";
      return;
    }

    msg.textContent = "Contraseña actualizada correctamente. Redirigiendo...";
    msg.className = "msg success";

    setTimeout(() => {
      window.location.href = "./login.html";
    }, 2000);
  });
  
</script>
</body>
</html>
