<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página en construcción</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0b;
      --accent:#e10600;
      --card:#121212;
      --radius:18px;
      color-scheme: dark;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html, body{
      height:100%;
    }

    body{
      font-family:'Poppins', system-ui, sans-serif;
      background:
        radial-gradient(800px 400px at 10% 20%, rgba(225,6,6,0.08), transparent),
        radial-gradient(800px 400px at 90% 80%, rgba(225,6,6,0.05), transparent),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      padding:24px;
      text-align:center;
    }

    .card{
      max-width:520px;
      width:100%;
      background:linear-gradient(180deg, #141414, #0d0d0d);
      border-radius:var(--radius);
      padding:40px 32px;
      box-shadow:0 20px 50px rgba(0,0,0,.6);
      animation:fadeIn .6s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(20px)}
      to{opacity:1; transform:none}
    }

    .icon{
      font-size:48px;
      margin-bottom:20px;
    }

    h1{
      font-size:26px;
      margin-bottom:12px;
      font-weight:700;
    }

    p{
      font-size:15px;
      color:rgba(255,255,255,.75);
      line-height:1.6;
    }

    .badge{
      margin-top:24px;
      display:inline-block;
      padding:8px 16px;
      border-radius:999px;
      background:rgba(225,6,6,.15);
      color:var(--accent);
      font-weight:600;
      font-size:13px;
    }

    .footer{
      margin-top:28px;
      font-size:13px;
      color:rgba(255,255,255,.5);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">🚧</div>

    <h1>Página de E-SHOP en construcción</h1>

    <p>
      Esta sección todavía no está disponible.<br>
      Estamos trabajando para habilitarla muy pronto.
    </p>

    <div class="badge">En desarrollo</div>

    <div class="footer">
      Gracias por tu paciencia 💛
    </div>
  </div>
</body>
</html>
