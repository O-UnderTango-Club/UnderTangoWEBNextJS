<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertango Club | Redes</title>

    <style>
        :root {
            --bg: #0b0b0b;
            --red: #8b1e1e;       /* rojo oscuro / bordó */
            --red-hover: #b12a2a;
            --text: #eaeaea;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #141414, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 1.2s ease;
        }

        h1 {
            font-size: 2.4rem;
            letter-spacing: 2px;
            margin-bottom: 35px;
            color: var(--red);
            animation: slideDown 1s ease;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 280px;
            margin: auto;
        }

        .links a {
            text-decoration: none;
            color: var(--text);
            background: rgba(139, 30, 30, 0.15);
            border: 1px solid rgba(139, 30, 30, 0.4);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            transition: 
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
            animation: fadeUp 0.8s ease forwards;
            opacity: 0;
        }

        .links a:nth-child(1) { animation-delay: 0.2s; }
        .links a:nth-child(2) { animation-delay: 0.35s; }
        .links a:nth-child(3) { animation-delay: 0.5s; }
        .links a:nth-child(4) { animation-delay: 0.65s; }
        .links a:nth-child(5) { animation-delay: 0.8s; }

        .links a:hover {
            background: rgba(177, 42, 42, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 30, 30, 0.25);
        }

        .back-btn {
            margin-top: 45px;
            display: inline-block;
            text-decoration: none;
            color: var(--red);
            font-size: 1rem;
            letter-spacing: 1px;
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(139, 30, 30, 0.6);
            transition: 
                background 0.3s ease,
                color 0.3s ease;
            animation: fadeIn 1.4s ease;
        }

        .back-btn:hover {
            background: rgba(139, 30, 30, 0.2);
            color: #fff;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>REDES <br> UNDERTANGO</h1>

<div class="links">
    <a href="https://open.spotify.com/intl-es/artist/6pZs3FGuJ5i1AtVrq30VuN" target="_blank">
        Spotify
    </a>
    <a href="https://www.instagram.com/undertangoclub/" target="_blank">
        Instagram
    </a>
    <a href="https://www.tiktok.com/@undertangoclub" target="_blank">
        TikTok
    </a>
    <a href="https://www.youtube.com/@undertangoclub" target="_blank">
        YouTube
    </a>
    <a href="https://www.facebook.com/undertangoclub" target="_blank">
        Facebook
    </a>
</div>


        <a href="javascript:history.back()" class="back-btn">
            ← volver
        </a>
    </div>

</body>
</html>
