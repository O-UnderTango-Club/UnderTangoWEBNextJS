<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lienzo del Modelo de Negocios — Ø UnderTango</title>
  <desc id="desc">Síntesis estratégica del modelo de negocios de UnderTango desarrollada para ÉLITROS.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfb}.ink{fill:#10233f}.teal{fill:#0d8e91}.tealDark{fill:#086a6d}.soft{fill:#edf5f4}.white{fill:#fff}.line{stroke:#0d8e91;stroke-width:2}.thin{stroke:#b8dedd;stroke-width:1.4}.title{font:700 42px Arial,sans-serif}.subtitle{font:italic 24px Arial,sans-serif}.h{font:700 19px Arial,sans-serif}.b{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}.whiteText{fill:#fff}.muted{fill:#526276}.key{font:700 20px Arial,sans-serif;fill:#086a6d}.goal{font:700 20px Arial,sans-serif}.brand{font:700 31px Arial,sans-serif}.caps{font:700 14px Arial,sans-serif;letter-spacing:1.8px}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="42" y="60" class="title ink">Lienzo del Modelo de Negocios — <tspan class="tealDark">Ø UnderTango</tspan></text>
  <text x="45" y="94" class="subtitle muted">Síntesis estratégica para ÉLITROS</text>
  <text x="1255" y="56" class="brand ink">Ø UnderTango</text>
  <text x="1258" y="82" class="caps tealDark">ARTE · TERRITORIO · INNOVACIÓN</text>

  <!-- Canvas main frame -->
  <rect x="35" y="125" width="1200" height="655" rx="18" class="white line"/>

  <!-- Associations -->
  <rect x="35" y="125" width="235" height="500" fill="#fff" class="line"/>
  <text x="55" y="160" class="h ink">ASOCIACIONES CLAVE</text>
  <text x="55" y="190" class="b ink"><tspan x="55" dy="0">• Hoteles, bares y venues</tspan><tspan x="70" dy="22">de la Triple Frontera</tspan><tspan x="55" dy="34">• Organismos de cultura,</tspan><tspan x="70" dy="22">turismo y festivales</tspan><tspan x="55" dy="34">• Músicos, bailarines, técnicos</tspan><tspan x="70" dy="22">y audiovisualistas</tspan><tspan x="55" dy="34">• Aliados tecnológicos</tspan><tspan x="70" dy="22">y red ÉLITROS</tspan></text>

  <!-- Activities / Resources -->
  <rect x="270" y="125" width="265" height="250" fill="#fff" class="line"/>
  <text x="292" y="160" class="h ink">ACTIVIDADES CLAVE</text>
  <text x="292" y="192" class="small ink"><tspan x="292" dy="0">• Producción de shows y experiencias</tspan><tspan x="306" dy="20">de tango</tspan><tspan x="292" dy="28">• Clases, workshops y activaciones</tspan><tspan x="306" dy="20">para turismo</tspan><tspan x="292" dy="28">• Desarrollo web y herramientas digitales</tspan><tspan x="292" dy="28">• Prospección comercial y alianzas</tspan></text>
  <rect x="270" y="375" width="265" height="250" fill="#fff" class="line"/>
  <text x="292" y="410" class="h ink">RECURSOS CLAVE</text>
  <text x="292" y="442" class="small ink"><tspan x="292" dy="0">• Marca Ø UnderTango y visión curatorial</tspan><tspan x="292" dy="26">• Equipo artístico multidisciplinario</tspan><tspan x="292" dy="26">• Repertorio, know-how y experiencia</tspan><tspan x="306" dy="19">escénica</tspan><tspan x="292" dy="26">• Red Iguazú / Foz / CDE</tspan><tspan x="292" dy="26">• Sistema digital, IA y organización</tspan></text>

  <!-- Value Proposition -->
  <rect x="535" y="125" width="290" height="500" rx="0" class="teal"/>
  <text x="560" y="163" class="h whiteText">PROPUESTA DE VALOR</text>
  <text x="680" y="225" text-anchor="middle" class="h whiteText"><tspan x="680">Experiencias de tango</tspan><tspan x="680" dy="28">contemporáneo que articulan</tspan><tspan x="680" dy="28">arte, tecnología y territorio.</tspan></text>
  <line x1="585" y1="325" x2="775" y2="325" stroke="#87d5d2" stroke-width="2"/>
  <text x="575" y="365" class="b whiteText"><tspan x="575">★ Shows memorables y adaptables</tspan><tspan x="575" dy="52">● Producto aplicable a turismo,</tspan><tspan x="596" dy="22">cultura y eventos</tspan><tspan x="575" dy="52">⌖ Identidad innovadora desde</tspan><tspan x="596" dy="22">la Triple Frontera</tspan></text>

  <!-- Relationships / Channels -->
  <rect x="825" y="125" width="245" height="250" fill="#fff" class="line"/>
  <text x="845" y="160" class="h ink">RELACIONES CON CLIENTES</text>
  <text x="845" y="192" class="small ink"><tspan x="845">• Atención directa y personalizada</tspan><tspan x="845" dy="28">• Co-diseño según venue o público</tspan><tspan x="845" dy="28">• Seguimiento por WhatsApp, mail</tspan><tspan x="859" dy="19">y reuniones</tspan><tspan x="845" dy="28">• Vínculos de largo plazo</tspan></text>
  <rect x="825" y="375" width="245" height="250" fill="#fff" class="line"/>
  <text x="845" y="410" class="h ink">CANALES</text>
  <text x="845" y="442" class="small ink"><tspan x="845">• Web UnderTango + elitros.</tspan><tspan x="859" dy="19">undertangoclub.com</tspan><tspan x="845" dy="28">• Instagram, Threads, Facebook</tspan><tspan x="859" dy="19">y WhatsApp</tspan><tspan x="845" dy="28">• Email comercial y networking</tspan><tspan x="845" dy="28">• Referidos, showcases y alianzas</tspan></text>

  <!-- Segments -->
  <rect x="1070" y="125" width="165" height="500" fill="#fff" class="line"/>
  <text x="1088" y="160" class="h ink">SEGMENTOS</text>
  <text x="1088" y="183" class="h ink">DE CLIENTES</text>
  <text x="1088" y="220" class="small ink"><tspan x="1088">• Hoteles,</tspan><tspan x="1101" dy="19">gastronomía y</tspan><tspan x="1101" dy="19">turismo premium</tspan><tspan x="1088" dy="32">• Festivales e</tspan><tspan x="1101" dy="19">instituciones</tspan><tspan x="1088" dy="32">• Eventos</tspan><tspan x="1101" dy="19">corporativos y</tspan><tspan x="1101" dy="19">sociales</tspan><tspan x="1088" dy="32">• Turistas y grupos</tspan><tspan x="1101" dy="19">internacionales</tspan></text>

  <!-- Costs / Revenue -->
  <rect x="35" y="625" width="590" height="155" fill="#fff" class="line"/>
  <text x="55" y="662" class="h ink">ESTRUCTURA DE COSTOS</text>
  <text x="55" y="694" class="small ink"><tspan x="55">• Honorarios artísticos y técnicos</tspan><tspan x="55" dy="24">• Traslados y logística Triple Frontera</tspan><tspan x="55" dy="24">• Sonido, vestuario y producción</tspan><tspan x="335" y="694">• Marketing y registro audiovisual</tspan><tspan x="335" dy="24">• Desarrollo digital y herramientas</tspan></text>
  <rect x="625" y="625" width="610" height="155" fill="#fff" class="line"/>
  <text x="648" y="662" class="h ink">FUENTES DE INGRESOS</text>
  <text x="648" y="694" class="small ink"><tspan x="648">• Shows y contrataciones en vivo</tspan><tspan x="648" dy="24">• Clases, workshops y experiencias turísticas</tspan><tspan x="648" dy="24">• Producciones para eventos y marcas</tspan><tspan x="975" y="694">• Curaduría / activaciones culturales</tspan><tspan x="975" dy="24">• Futuros productos y servicios digitales</tspan></text>

  <!-- Strategic keys -->
  <rect x="1260" y="125" width="305" height="655" rx="22" class="soft thin"/>
  <text x="1300" y="175" class="key">CLAVES ESTRATÉGICAS</text>
  <line x1="1300" y1="195" x2="1525" y2="195" class="thin"/>
  <text x="1300" y="245" class="b ink"><tspan class="tealDark">◆</tspan><tspan dx="14">Diferencial:</tspan><tspan x="1330" dy="25">arte + territorio + innovación</tspan></text>
  <line x1="1300" y1="300" x2="1525" y2="300" class="thin"/>
  <text x="1300" y="350" class="b ink"><tspan class="tealDark">↗</tspan><tspan dx="14">Escalabilidad vía producto,</tspan><tspan x="1330" dy="25">alianzas y sistema digital</tspan></text>
  <line x1="1300" y1="410" x2="1525" y2="410" class="thin"/>
  <text x="1300" y="460" class="b ink"><tspan class="tealDark">◎</tspan><tspan dx="14">Oportunidad:</tspan><tspan x="1330" dy="25">turismo, cultura y eventos</tspan><tspan x="1330" dy="25">en red regional</tspan></text>
  <line x1="1300" y1="545" x2="1525" y2="545" class="thin"/>
  <text x="1300" y="595" class="b ink"><tspan class="tealDark">●</tspan><tspan dx="14">ÉLITROS aporta metodología,</tspan><tspan x="1330" dy="25">validación y proyección</tspan></text>

  <!-- Footer -->
  <line x1="45" y1="835" x2="375" y2="835" class="thin"/>
  <text x="420" y="842" class="goal ink"><tspan class="tealDark">★</tspan><tspan dx="14">Objetivo:</tspan><tspan font-weight="400"> convertir UnderTango en una startup cultural sostenible, escalable y visible.</tspan></text>
</svg>
