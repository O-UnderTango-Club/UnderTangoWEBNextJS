<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnderTango — Iniciar sesión</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0b;
      --red:#e10600;
      --glass: rgba(255,255,255,0.04);
      --danger:#ff3b3b;
      --radius:18px;
      --shadow: 0 18px 45px rgba(0,0,0,0.6);
      color-scheme: dark;
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }

    body{
      margin:0;
      font-family:'Poppins', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% 20%, rgba(225,6,6,0.06), transparent),
        radial-gradient(1000px 500px at 90% 80%, rgba(225,6,6,0.04), transparent),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:white;
    }

    .card{
      max-width:420px;
      width:100%;
      background:linear-gradient(180deg, rgba(20,20,20,0.95), rgba(10,10,10,0.9));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:36px 30px;
      animation: enter 700ms cubic-bezier(.2,.9,.2,1);
    }

    @keyframes enter{
      from{ opacity:0; transform:translateY(30px) }
      to{ opacity:1; transform:none }
    }

    .logo{
      width:72px;
      height:72px;
      margin:0 auto 16px auto;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      letter-spacing:1px;
      background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
      border:1px solid rgba(255,255,255,0.05);
    }

    h1{
      text-align:center;
      margin:0 0 6px 0;
      font-size:24px;
    }

    .muted{
      text-align:center;
      font-size:13px;
      color:rgba(255,255,255,0.6);
      margin-bottom:22px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:14px;
    }

    label{
      font-size:13px;
      color:rgba(255,255,255,0.75);
    }

    input{
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.05);
      padding:13px;
      border-radius:12px;
      color:white;
      outline:none;
      font-size:15px;
    }

    input:focus{
      border-color:rgba(225,6,6,0.7);
      box-shadow:0 0 0 1px rgba(225,6,6,0.4);
    }

    .btn{
      width:100%;
      margin-top:10px;
      padding:12px;
      border-radius:12px;
      border:0;
      background:linear-gradient(120deg, rgba(225,6,6,0.95), rgba(150,0,0,0.9));
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    .msg{
      min-height:20px;
      margin-top:10px;
      font-size:13px;
      text-align:center;
    }

    .error{ color:var(--danger) }

    .footer a{
      display:inline-block;
      margin-top:6px;
      color:var(--red);
      text-decoration:none;
      font-weight:600;
      cursor:pointer;
    }

    .footer a{
      color:var(--red);
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">UT</div>

    <h1>Iniciar sesión</h1>
    <div class="muted">Accedé a tu cuenta UnderTango</div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required />
      </div>

      <button class="btn" type="submit">Ingresar</button>

      <div id="msg" class="msg"></div>
    </form>

    <div class="footer">
      ¿No tenés cuenta?
      <a href="../index.html">Registrate</a>
    </div>

  <div class="footer">
    <a href="#" id="forgot-password">¿Olvidaste tu contraseña?</a>
  </div>

  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
  <script type="application/javascript" src="//script2.chat-robot.com/?token=ed1139a97e102e18ec88a20b30f97aa3"></script>
</body>
</html>
