<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnderTango — Mi perfil</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0b;
      --red:#e10600;
      --glass: rgba(255,255,255,0.05);
      --radius:18px;
      --shadow: 0 18px 45px rgba(0,0,0,0.6);
      color-scheme: dark;
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }

    body{
      margin:0;
      font-family:'Poppins', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% 20%, rgba(225,6,6,0.06), transparent),
        radial-gradient(1000px 500px at 90% 80%, rgba(225,6,6,0.04), transparent),
        var(--bg);
      color:white;
      display:flex;
      flex-direction:column;
    }

    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:460px;
      background:linear-gradient(180deg, rgba(20,20,20,0.95), rgba(10,10,10,0.9));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:32px;
      text-align:center;
      animation: enter 600ms ease;
    }

    @keyframes enter{
      from{ opacity:0; transform:translateY(20px) }
      to{ opacity:1; transform:none }
    }

    .avatar{
      width:90px;
      height:90px;
      margin:0 auto 16px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:700;
      background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.4));
      border:1px solid rgba(255,255,255,0.06);
    }

    h1{ margin:0; font-size:22px }

    .dept{
      margin-top:6px;
      font-size:13px;
      color:var(--red);
      font-weight:600;
    }

    .email{
      margin-top:14px;
      font-size:14px;
      color:rgba(255,255,255,0.7);
      word-break:break-all;
    }

    /* ENCUESTA */
    .survey{ margin-top:28px; text-align:left }
    .survey h2{ font-size:16px; margin-bottom:12px; text-align:center }
    .survey label{ font-size:13px; margin-top:12px; display:block; color:rgba(255,255,255,0.85) }
    .survey select{
      width:100%;
      padding:10px;
      border-radius:10px;
      background:#111;
      border:1px solid rgba(255,255,255,0.1);
      color:white;
    }
    .survey button{
      margin-top:18px;
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:var(--red);
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    /* CALENDARIO */
    .calendar{ margin-top:32px }
    .calendar h2{ font-size:16px; margin-bottom:12px; text-align:center }
    .events-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px }
    .empty{ font-size:13px; color:rgba(255,255,255,0.5); text-align:center }

    .event-card{
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.04);
      border-radius:10px;
      padding:10px 12px;
      text-align:left;
    }

    .event-title{ font-size:14px; font-weight:600 }
    .event-date{ font-size:12px; color:rgba(255,255,255,0.7); margin-top:6px }

    .calendar-btn{
      margin-top:6px;
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .calendar-btn:hover{ background:rgba(255,255,255,0.14) }

    /* FOOTER */
    footer{
      position:sticky;
      bottom:0;
      background:rgba(10,10,10,0.95);
      backdrop-filter: blur(6px);
      border-top:1px solid rgba(255,255,255,0.03);
      display:flex;
      justify-content:space-around;
      align-items:center;
      padding:12px 6px;
      gap:8px;
    }

    footer a, footer button{
      background:none;
      border:none;
      color:white;
      font-family:inherit;
      font-size:13px;
      cursor:pointer;
      padding:8px 10px;
      border-radius:10px;
      text-decoration:none;
    }

    footer a:hover,
    footer button:hover{
      background:rgba(255,255,255,0.06);
    }

    .dropdown{ position:relative }
    .dropdown-menu{
      position:absolute;
      bottom:44px;
      right:0;
      background:#111;
      border:1px solid rgba(255,255,255,0.06);
      border-radius:12px;
      box-shadow:var(--shadow);
      display:none;
      min-width:200px;
      overflow:hidden;
      z-index:1500;
    }

    .dropdown-menu a{
      display:block;
      padding:10px 14px;
      font-size:13px;
      text-decoration:none;
      color:white;
    }

    .dropdown-menu a:hover{ background:rgba(255,255,255,0.06) }
    .dropdown.open .dropdown-menu{ display:block }

    /* FAB */
    .fab-calendario{
      position:fixed;
      right:20px;
      bottom:80px;
      width:58px;
      height:58px;
      border-radius:50%;
      background:var(--red);
      color:white;
      font-size:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
      z-index:999;
    }

    /* ================= MODAL ================= */

    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      transition:.25s;
      z-index:2000;
    }

    .modal-overlay.open{
      opacity:1;
      pointer-events:auto;
    }

    .modal{
      background:#111;
      width:100%;
      max-width:420px;
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      animation: enter .25s ease;
    }

    .modal-header{
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);
      align-items:center;
    }

    .modal-body{
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
      text-align:left;
    }

    .modal-body input,
    .modal-body textarea{
      background:#000;
      border:1px solid rgba(255,255,255,.08);
      border-radius:10px;
      padding:10px;
      color:white;
      width:100%;
    }

    .modal-body textarea{ min-height:80px; resize:none }

    .modal-footer{
      padding:16px 20px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }

    .btn-secondary{
      background:#000;
      border:1px solid rgba(255,255,255,.12);
      color:white;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--red);
      border:none;
      color:white;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
    }

    @media (max-width:520px){
      .card{ margin: 12px; padding:20px }
      .modal{ margin: 12px }
    }
  </style>
</head>

<body>

<script type="application/javascript" src="//script2.chat-robot.com/?token=ed1139a97e102e18ec88a20b30f97aa3"></script>

<main>
  <div class="card">
    <div class="avatar" id="avatar">UT</div>
    <h1 id="fullName">Cargando…</h1>
    <div class="dept" id="department">—</div>
    <div class="email" id="email">—</div>

    <div class="survey">
      <h2>Conocerte mejor</h2>

      <label>¿Qué te interesa más?</label>
      <select id="interest">
        <option value="">Elegí una opción</option>
        <option value="tango">Tango</option>
        <option value="teatro">Teatro</option>
        <option value="musica">Música</option>
        <option value="clases">Clases</option>
        <option value="programacion">Programación</option>
        <option value="social">Social</option>
      </select>

      <label>¿Cómo participás?</label>
      <select id="role">
        <option value="">Elegí una opción</option>
        <option value="espectador">Espectador</option>
        <option value="alumno">Alumno</option>
        <option value="artista">Artista</option>
        <option value="colaborador">Colaborador</option>
      </select>

      <button id="saveSurvey">Guardar preferencias</button>
    </div>

    <div class="calendar">
      <h2>📅 Mi calendario</h2>
      <div id="eventsList" class="events-list">
        <p class="empty">No tenés eventos todavía</p>
      </div>
      <button id="newEventBtn" class="calendar-btn">+ Nuevo evento</button>
    </div>
  </div>
</main>

<footer>
  <a href="https://www.undertangoclub.com/">Academia</a>
  <a href="pages/shows.html">Shows</a>
  <a href="pages/social.html">Social</a>

  <div class="dropdown" id="moreMenu">
    <button id="moreBtn">Más ▾</button>
    <div class="dropdown-menu" aria-label="Más enlaces">
      <a href="/pages/proyectos.html">Proyectos</a>
      <a href="/pages/clases.html">Clases</a>
      <a href="/pages/eshop.html">E-Shop</a>
      <a href="/pages/fdi.html">FDI</a>
      <a href="/pages/musica.html">Música</a>
      <a href="/pages/obradeteatro.html">Obras</a>
      <a href="/pages/redessociales.html">Redes</a>
      <a href="/pages/programacion.html">Programación</a>
    </div>
  </div>
</footer>

<a href="pages/calendario.html" class="fab-calendario" title="Abrir calendario">📅</a>

<!-- MODAL -->
<div id="eventModal" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <strong id="modalTitle">Crear evento</strong>
      <button id="closeEventModal" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <input id="eventTitle" placeholder="Título del evento" />
      <textarea id="eventDescription" placeholder="Descripción"></textarea>
      <input type="date" id="eventDate" />
      <input type="time" id="eventTime" />
    </div>
    <div class="modal-footer">
      <button id="cancelEvent" class="btn-secondary">Cancelar</button>
      <button id="saveEvent" class="btn-primary">Crear</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="profile.js"></script>
<script type="application/javascript" src="//script2.chat-robot.com/?token=ed1139a97e102e18ec88a20b30f97aa3"></script>
</body>
</html>
